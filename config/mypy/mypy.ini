# Strict type checking of the repository's Python code (PYTHON_CODE_QUALITY_STANDARD.md).
# Run from the repository root: .tools/quality/mypy/2.3.1/windows-x64/venv/Scripts/mypy --config-file config/mypy/mypy.ini
[mypy]
python_version = 3.12
strict = True
files = $MYPY_CONFIG_FILE_DIR/../../scripts, $MYPY_CONFIG_FILE_DIR/../../docs/v1.0.0/source

# python-docx is not installed in the mypy environment.
[mypy-docx.*]
ignore_missing_imports = True

# Modules that do not pass the strict checks yet. Remove a module when a change brings it into compliance.
[mypy-build_v1_documents,docx_to_md]
ignore_errors = True
