# WP1 (M1 foundation retrofit): baseline freeze.
# Rebuilds and retests the app on every push/PR to main. Sequential tasks in one
# Gradle invocation on one job — shares the daemon and dependency cache, which is
# faster in total than parallel jobs at this project size.
#
# The release build (assembleProdRelease) is deliberate: it exercises R8/minification (the step
# that broke in Phase 2 via Tink's compile-only annotations, and the most likely tripwire for
# the WP5 Hilt migration). The APK is unsigned — signing is out of scope until M6.
#
# WP4 (M1, ADR-017) added the environment flavor dimension (dev/qa/staging/prod × debug/release
# = 8 variants). CI builds only prodRelease (shipping identity + R8 tripwire) and devDebug (dev
# fast path) to bound CI time; all 8 assemble locally (WP4 exit check). generateLicenseReport
# produces the dependency/license inventory archived as an artifact (FR-247 partial).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest # Android SDK preinstalled, licenses pre-accepted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # WP3 (M1, ADR-016): detekt = style/complexity + ktlint (detekt-formatting); the Konsist
      # architecture rules (R1-R4) run inside the unit-test task. Both gate on their baselines —
      # only NEW findings fail.
      # WP4 (M1, ADR-017): -PbuildTime injects the real UTC build time into BuildConfig
      # (absent-safe — local builds fall back to "unknown"). Tests run on prodDebug (the
      # Konsist rules are variant-agnostic, scoped to src/main).
      - name: Unit tests + Konsist rules, detekt, dev/prod builds, lint, license inventory
        run: >
          ./gradlew testProdDebugUnitTest detekt assembleDevDebug assembleProdRelease lint
          generateLicenseReport -PbuildTime="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --stacktrace

      - name: Upload reports (tests + lint)
        if: always() # evidence survives red runs — that's when it matters
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
          retention-days: 14

      # WP4 (M1, FR-247 partial): the dependency/license inventory as a durable artifact.
      - name: Upload dependency-license inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-inventory
          path: app/build/reports/dependency-license/
          retention-days: 14

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

  # WP8 (M1, ADR-014 / M1_PLAN D4): on-device smoke matrix via Gradle-managed devices.
  # Runs the app/src/androidTest suite on API 30 + 35 (the `ci` device group) on the Actions
  # runners, which provide nested-virtualization/KVM. The full 26/29/30/33/35 matrix runs locally
  # on the NucBox — see docs/testing/WP8_GMD_MATRIX.md.
  #
  # continue-on-error + no pull_request trigger: this is the first CI wiring of GMD, and hosted-
  # runner emulator images can be flaky (M1_PLAN §3). Kept non-blocking and off the PR path for now
  # so it never gates a merge on emulator noise; a red run is triaged from the uploaded reports.
  # Flip continue-on-error off once it has proven stable over a few merges (same burn-down
  # philosophy as the WP1 lint / WP3 detekt baselines).
  instrumentation:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest # nested-virt/KVM available for the emulator
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      # KVM is present on standard ubuntu-latest runners but needs a udev rule to be group-
      # accessible, so the emulator gets hardware acceleration instead of slow software rendering.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # Accept the SDK licences, then pre-install the emulator + the three system images
      # SERIALLY. If left to GMD, the api30/api35/api36 setup tasks run as parallel Gradle work
      # actions that each shell out to sdkmanager to install the SHARED "emulator" package into the
      # same SDK dir; the concurrent installs race on that package's install-properties file and one
      # loses with InstallFailedException ("Failed to install ... emulator"). Installing everything
      # once up front means the setup tasks find it present and skip the install, so there is no race.
      # Image coords match systemImageSource="aosp" in build.gradle.kts (-> android-XX/default/x86_64).
      - name: Accept licences + pre-install emulator and system images
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "emulator" \
            "system-images;android-30;default;x86_64" \
            "system-images;android-35;default;x86_64" \
            "system-images;android-36;default;x86_64"

      # ciGroupProdDebugAndroidTest = the `ci` device group (api30 + 35 + 36) × prodDebug androidTest.
      # maxConcurrentDevices=1 keeps the emulators sequential so the runner does not run out of RAM.
      #
      # notAnnotation excludes the heavy OV-4 overlay-race burst (@OverlayRaceTest) from the fast
      # per-push gate — it is a test-tiering choice (build/CI config, not an ADR: GOVERNANCE §2.7).
      # OV-4 runs in its own lanes: the `full` GMD sweep (NucBox) + Moto G connected (api/no-regression)
      # and Firebase Test Lab (multi-OEM, scripts/ftl/). See M7_PLAN §10.
      - name: GMD smoke matrix (API 30 + 35 + 36), prodDebug
        run: >
          ./gradlew ciGroupProdDebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.notAnnotation=com.applock.e2e.OverlayRaceTest
          -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1
          -PbuildTime="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --stacktrace

      - name: Upload instrumentation reports
        if: always() # the androidTest HTML report is the triage evidence, especially on a red run
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
