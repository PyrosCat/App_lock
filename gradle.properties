org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# WP8 (M1, ADR-014): Gradle-managed devices reject API <= 26 by default, and AGP realizes a task
# for EVERY defined managed device at configuration time — so the api26 device (our minSdk floor,
# kept for NFR-COMP-001 coverage) fails task creation and takes down even the ci group (30+35) that
# doesn't use it. Opt in per AGP's own remedy. API-26 GMD images are "not recommended" (less
# reliable), so treat an api26 *run* failure as the documented floor caveat (WP8_GMD_MATRIX.md §5),
# distinct from this config flag which only lets the task be created.
android.experimental.testOptions.managedDevices.allowOldApiLevelDevices=true
